# Netlify build settings (D-13). Netlify detects Next.js and applies its Next.js runtime automatically:
# static pages are served from the CDN and next.config.ts headers are applied.
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Keep pnpm in line with the "packageManager" field in package.json.
  PNPM_VERSION = "10.28.0"
  NEXT_TELEMETRY_DISABLED = "1"
